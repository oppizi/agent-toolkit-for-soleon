name: PR Lint

# `pull_request_target` so the check also runs on PRs from forks, which a plain
# `pull_request` trigger cannot do with a read token. This is safe ONLY because
# this workflow never checks out or executes PR code — it reads the title through
# the API and nothing else. Do not add a checkout step here.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

# Keyed on the PR number, not github.ref: under pull_request_target the ref is
# the base branch, so every open PR would share one concurrency group and cancel
# the others.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr-title:
    name: Conventional commit title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # Types match the prefixes already used in this repo's history
      # (feat:, fix:, refactor:, chore:). Squash-merged PR titles become commit
      # messages, so this is what keeps that history readable.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
          requireScope: false
