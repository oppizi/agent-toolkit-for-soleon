name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Wednesday 14:23 UTC (off-peak, deliberately not on the hour).
    - cron: "23 14 * * 3"
  workflow_dispatch: {}

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write # upload SARIF to code scanning
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Scans the workflow YAML in this directory for Actions-specific
          # pitfalls: script injection through untrusted PR fields, over-broad
          # tokens, checkout of untrusted code under pull_request_target. Adding
          # CI is itself the new attack surface, so this is the highest-value
          # language here even though the repo ships no JavaScript.
          - language: actions
            build-mode: none
          # The converter, the engine seam, and the harness generators.
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
